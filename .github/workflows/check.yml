name: Check for new videos

on:
  schedule:
    # 12:00 and 00:00 Cairo; the two offsets cover DST and standard time.
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check the API without sending
        type: boolean
        default: false
      force_send:
        description: Send the full video list even if nothing is new
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: request-bot-check
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.cairo.outputs.run }}
    steps:
      - name: Check Cairo time
        id: cairo
        env:
          TZ: Africa/Cairo
        run: |
          hour="$(date +%H)"
          if [ "$hour" = "00" ] || [ "$hour" = "12" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Cairo time is $(date +%H:%M); skipping."
          fi

  check:
    needs: gate
    if: github.event_name != 'schedule' || needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Africa/Cairo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
          || sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2

      - name: Install dependencies
        run: npm ci

      - name: Locate Chrome
        run: |
          CHROME_PATH="$(node -e "console.log(require('puppeteer').executablePath())")"
          if [ ! -x "$CHROME_PATH" ]; then
            npx puppeteer browsers install chrome
            CHROME_PATH="$(node -e "console.log(require('puppeteer').executablePath())")"
          fi
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Restore encrypted state and WhatsApp session
        env:
          BOT_STATE_KEY: ${{ secrets.BOT_STATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/state-archive.js restore

      - name: Check for new videos and notify WhatsApp
        env:
          API_AUTHORIZATION: ${{ secrets.API_AUTHORIZATION }}
          API_KEY: ${{ secrets.API_KEY }}
          TEACHER_IDS: ${{ vars.TEACHER_IDS || '231,236' }}
          WHATSAPP_GROUP_NAME: ${{ vars.WHATSAPP_GROUP_NAME || 'TTTTT' }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          FORCE_SEND: ${{ github.event.inputs.force_send == 'true' && '1' || '0' }}
        run: node src/index.js

      - name: Save encrypted state and WhatsApp session
        if: always()
        env:
          BOT_STATE_KEY: ${{ secrets.BOT_STATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/state-archive.js save
